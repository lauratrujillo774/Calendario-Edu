<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/inicio-sesion.css">
    <title>Iniciar sesión · EduCal</title>

</head>
<body>
    <a class="boton-inicio" href="pagina-principal.html">← Inicio</a>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <div id="botonGoogleLogin" class="boton-google"></div>
        <p class="separador-google" id="separadorGoogle"><span>o con tu correo</span></p>

        <form id="formLogin">
            <div class="input-box">
                <input type="email" id="correo" placeholder="Correo electrónico" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <p id="mensaje" class="mensaje" role="alert"></p>

            <button type="submit">Ingresar</button>

            <p class="extra">
                ¿Olvidaste tu contraseña?
                <a href="#">Recuperar</a>
            </p>

            <p class="extra">
                ¿No tienes cuenta?
                <a href="registrarse.html">Registrarse</a>
            </p>
        </form>
    </div>

<script src="../js/ojo-password.js"></script>
<script src="../js/config.js"></script>
<script src="../js/inicio-sesion.js"></script>
<script src="../js/google.js"></script>
<script>iniciarGoogle("botonGoogleLogin", "signin_with", "separadorGoogle");</script>
</body>
</html>
